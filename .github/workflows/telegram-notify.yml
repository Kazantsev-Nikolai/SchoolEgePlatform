name: Telegram PR Notifications

on:
  pull_request:
    types: [opened, reopened, closed, synchronize]
  pull_request_review:
    types: [submitted]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR info
        id: pr_info
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "pr_title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
            echo "pr_author=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
            echo "pr_url=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT
            echo "pr_head=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
            echo "pr_base=${{ github.event.pull_request.base.ref }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "pr_title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
            echo "pr_author=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
            echo "pr_url=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT
            echo "pr_head=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
            echo "pr_base=${{ github.event.pull_request.base.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        run: |
          # Определяем текст сообщения в зависимости от события
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            case "${{ github.event.action }}" in
              "opened")
                TEXT="🆕 **Новый Pull Request**"
                DETAIL="Открыт PR"
                ;;
              "reopened")
                TEXT="🔄 **PR переоткрыт**"
                DETAIL="PR был закрыт и снова открыт"
                ;;
              "closed")
                if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
                  TEXT="🎉 **PR смержен!**"
                  DETAIL="Изменения добавлены в ветку"
                else
                  TEXT="❌ **PR закрыт**"
                  DETAIL="PR закрыт без мержа"
                fi
                ;;
              "synchronize")
                TEXT="📝 **PR обновлен**"
                DETAIL="В PR добавлены новые коммиты"
                ;;
              *)
                TEXT="📌 **Событие PR**"
                DETAIL="Действие: ${{ github.event.action }}"
                ;;
            esac
          elif [ "${{ github.event_name }}" = "pull_request_review" ]; then
            case "${{ github.event.review.state }}" in
              "approved")
                TEXT="✅ **PR одобрен**"
                DETAIL="Ревьювер одобрил изменения"
                ;;
              "changes_requested")
                TEXT="🔄 **Запрошены изменения**"
                DETAIL="Ревьювер запросил правки"
                ;;
              "commented")
                TEXT="💬 **Новый комментарий**"
                DETAIL="Ревьювер оставил комментарий"
                ;;
              *)
                TEXT="📋 **Новый ревью**"
                DETAIL="Статус: ${{ github.event.review.state }}"
                ;;
            esac
          else
            TEXT="📢 **Событие в репозитории**"
            DETAIL=""
          fi

          # Формируем полное сообщение
          MESSAGE="$TEXT%0A%0A"
          MESSAGE="$MESSAGE📦 **Репозиторий:** ${{ github.repository }}%0A"
          MESSAGE="$MESSAGE📌 **PR:** ${{ steps.pr_info.outputs.pr_title }} #${{ steps.pr_info.outputs.pr_number }}%0A"
          MESSAGE="$MESSAGE👤 **Автор:** ${{ steps.pr_info.outputs.pr_author }}%0A"
          MESSAGE="$MESSAGE🌿 **Ветка:** ${{ steps.pr_info.outputs.pr_head }} → ${{ steps.pr_info.outputs.pr_base }}%0A"
          
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            MESSAGE="$MESSAGE👥 **Ревьювер:** ${{ github.event.review.user.login }}%0A"
          fi
          
          if [ -n "$DETAIL" ]; then
            MESSAGE="$MESSAGE📝 **Детали:** $DETAIL%0A"
          fi
          
          MESSAGE="$MESSAGE%0A🔗 ${{ steps.pr_info.outputs.pr_url }}"

          # Отправляем в Telegram
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d message_thread_id="${{ secrets.TELEGRAM_THREAD_TOPIC }}" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown"